name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        config:
          - { name: release, flags: "-DCMAKE_BUILD_TYPE=Release" }
          - { name: asan-ubsan, flags: "-DCMAKE_BUILD_TYPE=Debug -DTICKSTORE_SANITIZE=ON" }
    name: ${{ matrix.config.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zlib1g-dev libsqlite3-dev
      - name: Configure
        run: cmake -S . -B build ${{ matrix.config.flags }}
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
